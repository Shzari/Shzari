[tool.black]
line-length = 140
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
(
  ^/venv
  | ^/\.venv
)
'''

[tool.ruff]
line-length = 140
target-version = "py311"
exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E9"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
no_implicit_optional = false
exclude = "(venv|\\.venv)"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
