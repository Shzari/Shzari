{% extends "layouts/base.html" %}
{% block page_title %}Set Password{% endblock %}
{% block body %}
  <div class="card narrow glass">
    <h1>Set Your Password</h1>
    <p>User <b>{{ username }}</b> must set a new password to continue.</p>

    {% include "components/messages.html" %}

    <form method="post">
      <label>New Password</label>
      <input name="new_password" type="password" required>

      <label>Confirm Password</label>
      <input name="confirm_password" type="password" required>

      <label>SSH Timeout (seconds)</label>
      <input name="timeout" type="number" value="8" min="3" max="30">

      <button class="btn run" type="submit">Save Password and Login</button>
    </form>
  </div>
{% endblock %}
