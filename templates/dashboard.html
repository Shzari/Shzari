<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Network Tool - Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script>
    function selectAllDevices() {
      document.querySelectorAll('.device-box').forEach(cb => cb.checked = true);
    }
    function clearDevices() {
      document.querySelectorAll('.device-box').forEach(cb => cb.checked = false);
    }
    function selectGroup() {
      const grp = document.getElementById('groupSelect').value;
      clearDevices();
      if (!grp) return;
      document.querySelectorAll(`.group-${grp}`).forEach(cb => cb.checked = true);
    }
    function setCommand(cmd) {
      document.getElementById('selected_command').value = cmd;
      document.getElementById('manual_command').value = '';
    }
    function handleRunSubmit() {
      const form = document.getElementById('runForm');
      const key = 'output_window_opened';
      const targetName = 'network_output_window';
      if (!sessionStorage.getItem(key)) {
        window.open('', targetName);
        sessionStorage.setItem(key, '1');
      }
      form.target = targetName;
      return true;
    }
  </script>
</head>
<body>
  <div class="page-bg"></div>

  <div class="user-strip">
    <div class="chip">👤 User: <b>{{ current_user or 'Unknown' }}</b></div>
    <div class="chip">🔐 Mode: <b>{{ auth_mode|upper }}</b></div>
    <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
  </div>

  <div class="topbar glass">
    <h2>⚡ Network SSH Troubleshooting Dashboard</h2>
    <p>Fast operations for routers and switches.</p>
  </div>

  <div class="grid">
    <div class="card glass">
      <h3>Device Selection</h3>
      <div class="action-row">
        <button class="btn" type="button" onclick="selectAllDevices()">Select All</button>
        <button class="btn ghost" type="button" onclick="clearDevices()">Clear</button>
      </div>
      <label>Group</label>
      <select id="groupSelect" onchange="selectGroup()">
        <option value="">--Choose group--</option>
        {% for grp in groups.keys() %}
          <option value="{{ grp }}">{{ grp }}</option>
        {% endfor %}
      </select>

      <div class="device-list">
        {% for d in devices %}
          <label class="device-item">
            <input class="device-box {% for g in d.groups %}group-{{ g }} {% endfor %}" type="checkbox" name="selected_devices" value="{{ d.name }}" form="runForm">
            <span>{{ d.name }}</span>
            <small>{{ d.host }}</small>
          </label>
        {% endfor %}
      </div>
    </div>

    <div class="card glass">
      <h3>Commands</h3>
      <form method="post" action="{{ url_for('run_commands') }}" id="runForm" onsubmit="return handleRunSubmit()">
        <label>Command buttons</label>
        <div class="buttons-wrap">
          {% for b in buttons %}
            <button class="btn {% if b.id.startswith('custom-') %}custom{% endif %}" type="button" onclick="setCommand('{{ b.command }}')">{{ b.label }}</button>
          {% endfor %}
        </div>

        <label>Selected button command</label>
        <input id="selected_command" name="selected_command" type="text" placeholder="Click a button to load command">

        <label>Manual command (overrides selected button command)</label>
        <input id="manual_command" name="manual_command" type="text" placeholder="Type any show/troubleshoot command">

        <div class="action-row">
          <button class="btn run" type="submit">RUN</button>
        </div>
      </form>

      <details class="submenu">
        <summary>⚙️ Button Menu / Sub Menu</summary>

        <form method="post" action="{{ url_for('buttons_menu') }}" class="submenu-form">
          <input type="hidden" name="action" value="add">
          <label>Add button label</label>
          <input name="new_label" type="text" placeholder="e.g., Check CPU">
          <label>Add button command</label>
          <input name="new_command" type="text" placeholder="e.g., show processes cpu sorted">
          <button class="btn" type="submit">Add Button</button>
        </form>

        <form method="post" action="{{ url_for('buttons_menu') }}" class="submenu-form">
          <input type="hidden" name="action" value="rename">
          <label>Choose button to rename</label>
          <select name="button_id">
            {% for b in buttons %}
              <option value="{{ b.id }}">{{ b.label }} ({{ b.command }})</option>
            {% endfor %}
          </select>
          <label>New button name</label>
          <input name="rename_label" type="text" placeholder="New label">
          <button class="btn" type="submit">Rename Button</button>
        </form>

        <form method="post" action="{{ url_for('buttons_menu') }}" class="submenu-form">
          <input type="hidden" name="action" value="clear_history">
          <button class="btn ghost" type="submit">Clear Output History</button>
        </form>
      </details>
    </div>
  </div>
</body>
</html>
