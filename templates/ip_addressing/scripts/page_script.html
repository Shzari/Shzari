    function branchSortValue(name){const raw=String(name||'').trim();if(/^\d+$/.test(raw))return {num:Number(raw),text:''};const m=raw.match(/(\d+)/);if(m)return {num:Number(m[1]),text:raw.toLowerCase()};return {num:Number.POSITIVE_INFINITY,text:raw.toLowerCase()};}

    function ipToInt(ip){const p=String(ip).split('.').map(Number);return (((p[0]<<24)>>>0)+((p[1]<<16)>>>0)+((p[2]<<8)>>>0)+(p[3]>>>0))>>>0;} function intToIp(n){n=Number(n)>>>0;return `${(n>>>24)&255}.${(n>>>16)&255}.${(n>>>8)&255}.${n&255}`;}

    function seedFromServer(){const names=SERVER_BRANCH_NAMES;if(!Array.isArray(names)||!names.length)return [];const base='10.10.10.0';const cidr=27;const block=blockSizeFromCidr(cidr);const start=ipToInt(base);return names.map((n,idx)=>{const nb=intToIp(start+idx*block);const gen=makeIpRows(nb,cidr);return {id:`b-${idx+1}`,name:n,site:'Site',networkBase:nb,cidr,subnetMask:cidrToMask(cidr),gateway:gen.gateway,broadcast:gen.broadcast,createdAt:nowStamp(),updatedAt:nowStamp(),ipRows:gen.ipRows};});}

    function digitsOnly(value,maxLen){const raw=String(value??'').replace(/\D/g,'');return Number.isFinite(maxLen)?raw.slice(0,Math.max(0,Number(maxLen))):raw;}
    function sanitizeIpv4Typing(value,opts={}){
      const suppressAutoDot=Boolean(opts&&opts.suppressAutoDot);

      const cleanParts=sourceParts.map((part,partIndex)=>{
        let out='';
        for(const ch of String(part||'')){
          if(!/\d/.test(ch))continue;
          if(disallowFourthOctetStartsWithZero&&partIndex===3&&out.length===0&&ch==='0')continue;
          if(out.length>=3)break;
          const candidate=`${out}${ch}`;

        return out;

    }
    function isValidIpv4Value(value){const text=String(value??'').trim();if(!/^\d{1,3}(\.\d{1,3}){3}$/.test(text))return false;return text.split('.').every((octet)=>{const n=Number(octet);return Number.isInteger(n)&&n>=0&&n<=255;});}
    function splitIpv4(value){return String(value??'').trim().split('.').map((part)=>String(part).trim());}
    function hasNonZeroFourthOctet(value){if(!isValidIpv4Value(value))return false;const parts=splitIpv4(value);return Number(parts[3])>0;}
    function isValidWanGatewayIpValue(value){return isValidIpv4Value(value)&&hasNonZeroFourthOctet(value);}
    function haveSameFirstThreeOctets(left,right){if(!isValidIpv4Value(left)||!isValidIpv4Value(right))return false;const a=splitIpv4(left);const b=splitIpv4(right);return a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2];}
    function normalizeIpv4Value(value){const text=sanitizeIpv4Typing(value).replace(/\.$/,'');if(!isValidIpv4Value(text))return text;return text.split('.').map((octet)=>String(Number(octet))).join('.');}

    function formatBranchCodeValue(value){const upper=String(value??'').trim().toUpperCase();const digits=digitsOnly(upper.replace(/^B/,''),3);if(!digits)return '';return `B${digits}`;}

    async function finalizeIspInternetRow(index){
      if(!canWriteIspInternet())return;
      if(!Array.isArray(ispInternetRows)||!ispInternetRows[index])return;
      const prevRow={...(ispInternetRows[index]||{})};
      syncIspInternetRowFromDom(index);
      maybeSuggestGateway(ispInternetRows[index],prevRow,'public_ip','gateway','_gateway_manual');
      ispInternetRows[index]=normalizeIspInternetRow(ispInternetRows[index]);
      writeIspInternetRowToDom(index);
      const row=ispInternetRows[index];
      if(ispInternetEditingIndex===index&&ispInternetManualEditIndex===index){queueSaveIspInternetRows();return;}
      if(row.locked)return;
      if(isIspInternetRowComplete(row)){
        row.locked=true;
        if(ispInternetEditingIndex===index)ispInternetEditingIndex=-1;
        if(ispInternetManualEditIndex===index)ispInternetManualEditIndex=-1;
        renderIspInternetRows();
        if(ispInternetSaveTimer){clearTimeout(ispInternetSaveTimer);ispInternetSaveTimer=null;}
        const result=await saveIspInternetRows();
        if(!result.ok){
          row.locked=false;
          renderIspInternetRows();
          alert(`Auto-save failed: ${result.error||'Unknown error'}`);
        }
        return;
      }
      queueSaveIspInternetRows();
    }

    function drawLineChart(canvasId, points, color, opts){
      const options=(opts&&typeof opts==='object')?opts:{};
      const canvas=document.getElementById(canvasId);if(!canvas)return;
      const ctx=canvas.getContext('2d');if(!ctx)return;
      const ratio=window.devicePixelRatio||1;
      const w=canvas.clientWidth||460;
      const h=canvas.clientHeight||200;
      canvas.width=Math.floor(w*ratio);
      canvas.height=Math.floor(h*ratio);
      ctx.setTransform(ratio,0,0,ratio,0,0);
      ctx.clearRect(0,0,w,h);
      ctx.fillStyle='#fbfdff';
      ctx.fillRect(0,0,w,h);

      const leftPad=options.leftPad||44;
      const rightPad=10;
      const topPad=6;
      const bottomPad=26;
      const plotW=Math.max(10,w-leftPad-rightPad);
      const plotH=Math.max(10,h-topPad-bottomPad);

      const rawRows=Array.isArray(points)?points:[];
      const entries=rawRows.map((item)=>{if(item&&typeof item==='object'&&!Array.isArray(item)){const value=Number(item.value);if(!Number.isFinite(value))return null;const tsRaw=String(item.ts||'').trim();const tsDate=new Date(tsRaw);const tsMs=Number.isNaN(tsDate.getTime())?null:tsDate.getTime();return {value,tsRaw,tsMs};}const value=Number(item);if(!Number.isFinite(value))return null;return {value,tsRaw:'',tsMs:null};}).filter((item)=>item!==null);
      const vals=entries.map((item)=>Number(item.value)).filter((v)=>Number.isFinite(v));

      const hasFixedRange=Number.isFinite(Number(options.min))&&Number.isFinite(Number(options.max));
      const min=hasFixedRange?Number(options.min):(vals.length?Math.min(...vals):0);
      const max=hasFixedRange?Number(options.max):(vals.length?Math.max(...vals):1);
      const span=Math.max(1,max-min);

      ctx.strokeStyle='#d8e2f0';
      ctx.lineWidth=1;
      const ticks=Array.isArray(options.yTicks)&&options.yTicks.length?options.yTicks:[min+(span*0.2),min+(span*0.4),min+(span*0.6),min+(span*0.8),max];
      ctx.fillStyle='#6b7c94';
      ctx.font='11px Segoe UI';
      ticks.forEach((t)=>{
        const y=topPad+((max-Number(t))/span)*plotH;
        ctx.beginPath();
        ctx.moveTo(leftPad,y);
        ctx.lineTo(leftPad+plotW,y);
        ctx.stroke();
        const label=(typeof options.yTickFormatter==='function')?String(options.yTickFormatter(Number(t))):String(Math.round(Number(t)));
        ctx.fillText(label,4,y+4);
      });

      ctx.beginPath();
      ctx.moveTo(leftPad,topPad);
      ctx.lineTo(leftPad,topPad+plotH);
      ctx.lineTo(leftPad+plotW,topPad+plotH);
      ctx.strokeStyle='#cdd8e8';
      ctx.stroke();

      const xLabelFor=(entry,startMs,endMs)=>{
        if(!entry||!Number.isFinite(entry.tsMs||NaN))return'';
        const d=new Date(Number(entry.tsMs));
        const hh=String(d.getHours()).padStart(2,'0');
        const mm=String(d.getMinutes()).padStart(2,'0');
        const dd=String(d.getDate()).padStart(2,'0');
        const mo=String(d.getMonth()+1).padStart(2,'0');
        const spanMs=Math.max(0,Number(endMs)-Number(startMs));
        if(spanMs<=24*60*60*1000)return `${hh}:${mm}`;
        if(spanMs<=14*24*60*60*1000)return `${dd}-${mo} ${hh}:${mm}`;
        return `${dd}-${mo}`;
      };

      if(!vals.length){
        ctx.fillStyle='#6b7c94';
        ctx.font='12px Segoe UI';
        ctx.fillText(String(options.noDataText||'No data'),leftPad+8,topPad+14);
        canvas.onmousemove=null;
        canvas.onmouseleave=null;
        canvas.title='';
        return;
      }

      const firstMs=Number(entries[0]?.tsMs||0);
      const lastMs=Number(entries[entries.length-1]?.tsMs||0);
      const hasTimeAxis=entries.some((e)=>Number.isFinite(e.tsMs||NaN));
      if(hasTimeAxis){
        const labelCount=Math.min(6,entries.length);
        const safeCount=Math.max(2,labelCount);
        ctx.fillStyle='#6b7c94';
        ctx.font='10px Segoe UI';
        ctx.textAlign='center';
        for(let i=0;i<safeCount;i++){
          const idx=(safeCount<=1)?0:Math.round(i*(entries.length-1)/(safeCount-1));
          const x=(entries.length<=1)?leftPad:(leftPad+(idx*plotW/(entries.length-1)));
          const entry=entries[idx];
          const label=xLabelFor(entry,firstMs,lastMs);
          if(!label)continue;
          ctx.fillText(label,x,topPad+plotH+14);
        }
        ctx.textAlign='left';
      }

      ctx.strokeStyle=color||'#2f6fec';
      ctx.lineWidth=2;
      ctx.beginPath();
      entries.forEach((entry,i)=>{
        const x=(entries.length<=1)?leftPad:(leftPad+(i*plotW/(entries.length-1)));
        const y=topPad+((max-entry.value)/span)*plotH;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();

      const valueFormatter=(typeof options.valueFormatter==='function')?options.valueFormatter:(v=>String(Math.round(Number(v))));
      const seriesLabel=String(options.seriesLabel||'Value');
      const pointAtClientX=(clientX)=>{
        const rect=canvas.getBoundingClientRect();
        const x=clientX-rect.left;
        if(entries.length<=1)return 0;
        const ratioX=(x-leftPad)/plotW;
        const idx=Math.round(Math.max(0,Math.min(1,ratioX))*(entries.length-1));
        return Math.max(0,Math.min(entries.length-1,idx));
      };
      canvas.onmousemove=(ev)=>{
        const idx=pointAtClientX(ev.clientX);
        const row=entries[idx];
        if(!row)return;
        const tsText=row.tsRaw?formatDateTime(row.tsRaw):'';
        const valueText=valueFormatter(row.value);
        canvas.title=`${seriesLabel}: ${valueText}${tsText?` | ${tsText}`:''}`;
      };
      canvas.onmouseleave=()=>{canvas.title='';};
    }
    function percentTrendAxisOptions(points,capTo100){const vals=(Array.isArray(points)?points:[]).map((v)=>Number(v)).filter((v)=>Number.isFinite(v)&&v>=0);const peak=vals.length?Math.max(...vals):0;const dynamicMax=Math.max(10,peak*2);const yMax=capTo100?Math.min(100,dynamicMax):dynamicMax;const step=yMax/5;return {min:0,max:yMax,yTicks:[0,step,step*2,step*3,step*4,yMax],yTickFormatter:(v)=>`${(Math.round(v*10)/10).toString().replace(/\\.0$/,'')}%`};}

    function filterSeriesByRange(allRows,rangeDef){const rows=Array.isArray(allRows)?allRows:[];const bounds=computeRangeBounds(rangeDef);const startMs=bounds.start.getTime();const endMs=bounds.end.getTime();return rows.filter((row)=>{const ts=new Date(String(row?.collected_at||''));if(Number.isNaN(ts.getTime()))return false;const ms=ts.getTime();return ms>=startMs&&ms<=endMs;});}
    function renderMonitoringTrendCharts(){
      const cpuRange=monitoringChartRanges.cpu||{type:'relative',minutes:30,label:'Last 30 minutes'};
      const memRange=monitoringChartRanges.memory||{type:'relative',minutes:30,label:'Last 30 minutes'};
      const respRange=monitoringChartRanges.response||{type:'relative',minutes:30,label:'Last 30 minutes'};

    function renderWindowsServerCards(payload){const data=(payload&&typeof payload==='object')?payload:{};const isWindows=Boolean(data.is_windows_server);const diskBox=document.getElementById('ndWindowsDiskBox');const bottom=document.getElementById('ndWindowsBottomRow');const throughputBox=document.getElementById('ndGaugeThroughputBox');if(diskBox)diskBox.classList.toggle('hidden',!isWindows);if(bottom)bottom.classList.toggle('hidden',!isWindows);if(throughputBox)throughputBox.classList.toggle('hidden',!isWindows);const rxGauge=document.getElementById('ndGaugeRx');const txGauge=document.getElementById('ndGaugeTx');const rxVal=Number(data.network_rx_mbps);const txVal=Number(data.network_tx_mbps);if(rxGauge)rxGauge.textContent=Number.isFinite(rxVal)?`${rxVal.toFixed(2)} Mbps`:'-';if(txGauge)txGauge.textContent=Number.isFinite(txVal)?`${txVal.toFixed(2)} Mbps`:'-';if(!isWindows)return;const diskBody=document.getElementById('ndWindowsDiskBody');if(diskBody){const disks=Array.isArray(data.disk_usage)?data.disk_usage:[];if(!disks.length){diskBody.innerHTML='<div class="node-util-empty">No logical disks data available.</div>';}else{diskBody.innerHTML=disks.map((d)=>{const label=escapeHtml(String(d?.label||'-'));const usedRaw=Number(d?.used_percent);const used=Number.isFinite(usedRaw)?Math.max(0,Math.min(100,usedRaw)):0;const freeRaw=Number(d?.free_gb);const freeText=(Number.isFinite(freeRaw)&&freeRaw>0)?`${freeRaw.toFixed(2)} GB`:'-';const warn=used>85?' warn':'';return `<div class="node-util-row"><div class="node-util-status">${label}</div><div class="node-util-iface"><div class="node-util-iface-main">${Math.round(used)}%</div><div class="node-util-iface-desc">Used</div></div><div class="node-util-meter"><div class="node-util-bar"><div class="node-util-fill${warn}" style="width:${used}%"></div></div><div class="node-util-pct">${Math.round(used)}%</div></div><div class="node-util-meter"><div class="node-util-pct">${freeText}</div></div></div>`;}).join('');}}const upEl=document.getElementById('ndWinUptime');if(upEl)upEl.textContent=formatUptime(data.uptime_seconds);applyWindowsServerTextFields(data);}
    function stopMonitoringLiveGaugeRefresh(){if(monitoringDashboardLiveGaugeTimer){clearInterval(monitoringDashboardLiveGaugeTimer);monitoringDashboardLiveGaugeTimer=null;}monitoringDashboardLiveGaugeInFlight=false;}
    function startMonitoringLiveGaugeRefresh(){if(!monitoringDashboardIsWindows||!monitoringDashboardDeviceName)return;const modal=document.getElementById('monitoringNodeDashboardModal');if(!modal||!modal.open)return;if(monitoringDashboardLiveGaugeTimer)return;refreshMonitoringNodeLiveGauges();monitoringDashboardLiveGaugeTimer=setInterval(()=>{refreshMonitoringNodeLiveGauges();},1000);}
    async function refreshMonitoringNodeLiveGauges(){if(!monitoringDashboardIsWindows||!monitoringDashboardDeviceName)return;if(monitoringDashboardLiveGaugeInFlight)return;const modal=document.getElementById('monitoringNodeDashboardModal');if(!modal||!modal.open)return;monitoringDashboardLiveGaugeInFlight=true;try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9000);const res=await fetch(MONITORING_LIVE_GAUGES_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_name:monitoringDashboardDeviceName}),signal:controller.signal});clearTimeout(timer);if(res.status===401){window.location='{{ url_for("login", expired=1) }}';return;}let data={};try{data=await res.json();}catch(_e){data={ok:false};}if(!res.ok||!data?.ok)return;setGaugeRing('ndCpuGauge',Number(data.cpu_percent||0),100);setGaugeRing('ndMemGauge',Number(data.memory_percent||0),100);setGaugeRing('ndSlaGauge',Number(data.sla_ms||0),300);const rxVal=Number(data.network_rx_mbps);const txVal=Number(data.network_tx_mbps);const rxGauge=document.getElementById('ndGaugeRx');const txGauge=document.getElementById('ndGaugeTx');if(rxGauge)rxGauge.textContent=Number.isFinite(rxVal)?`${rxVal.toFixed(2)} Mbps`:'-';if(txGauge)txGauge.textContent=Number.isFinite(txVal)?`${txVal.toFixed(2)} Mbps`:'-';const upEl=document.getElementById('ndWinUptime');if(upEl&&data.uptime_seconds!==undefined&&data.uptime_seconds!==null)upEl.textContent=formatUptime(data.uptime_seconds);applyWindowsServerTextFields(data);const statusRaw=String(data.status||'unknown').trim().toLowerCase();const statusUpper=statusRaw.toUpperCase();const uptimeText=(statusRaw==='up'&&data.uptime_seconds!==undefined&&data.uptime_seconds!==null)?formatUptime(data.uptime_seconds):'-';const statusDisplay=(statusRaw==='up'&&uptimeText&&uptimeText!=='-')?`${statusUpper} / ${uptimeText}`:statusRaw;const ndStatus=document.getElementById('ndStatus');if(ndStatus)ndStatus.textContent=statusDisplay;const ndLast=document.getElementById('ndLast');if(ndLast)ndLast.textContent=formatDateTime(data.sampled_at||'');}catch(_e){}finally{monitoringDashboardLiveGaugeInFlight=false;}}
    async function acknowledgeMonitoringAlert(alertId){const id=Number(alertId||0);if(!Number.isFinite(id)||id<=0)return;try{const res=await fetch(MONITORING_ACK_ALERT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({alert_id:id})});const data=await res.json();if(!res.ok||!data?.ok){showRunStatus(String(data?.error||'Failed to acknowledge alert.'),true);return;}if(monitoringDashboardDeviceName)openMonitoringNodeDashboard(monitoringDashboardDeviceName,false);}catch(_e){showRunStatus('Failed to acknowledge alert.',true);}}
    function renderMonitoringAlerts(alerts){const body=document.getElementById('ndAlertsBody');if(!body)return;const rows=Array.isArray(alerts)?alerts:[];if(!rows.length){body.innerHTML='<div class="node-util-empty">No active alerts.</div>';return;}body.innerHTML=rows.map((a)=>{const id=Number(a?.id||0);const sev=String(a?.severity||'warning').toLowerCase();const status=String(a?.status||'open').toUpperCase();const key=escapeHtml(String(a?.alert_key||'-'));const msg=escapeHtml(String(a?.message||'-'));const upd=escapeHtml(formatDateTime(String(a?.updated_at||'')));const val=(a?.last_value===null||a?.last_value===undefined)?'-':escapeHtml(String(a.last_value));const thr=(a?.threshold_value===null||a?.threshold_value===undefined)?'-':escapeHtml(String(a.threshold_value));const canAck=MONITORING_CAN_MANAGE&&String(a?.status||'').toLowerCase()==='open';const ackBtn=canAck?`<button class="btn" type="button" onclick="acknowledgeMonitoringAlert(${id})">Ack</button>`:'';return `<div class="node-alert-row"><div><div class="node-alert-sev ${sev}">${sev}</div><div class="node-alert-meta">${status} • ${key}</div></div><div><div>${msg}</div><div class="node-alert-meta">Value: ${val} | Threshold: ${thr} | Updated: ${upd}</div></div><div>${ackBtn}</div></div>`;}).join('');}
    function formatDateTime(value){const raw=String(value||'').trim();if(!raw)return'-';const d=new Date(raw);if(Number.isNaN(d.getTime()))return raw;const hh=String(d.getHours()).padStart(2,'0');const mi=String(d.getMinutes()).padStart(2,'0');const dd=String(d.getDate()).padStart(2,'0');const mm=String(d.getMonth()+1).padStart(2,'0');const yyyy=String(d.getFullYear());return `${hh}:${mi} - ${dd}-${mm}-${yyyy}`;}
    async function openMonitoringNodeDashboard(deviceName,forceRefresh){
      const name=String(deviceName||'').trim();
      if(!name)return;
      if(monitoringDashboardDeviceName&&monitoringDashboardDeviceName!==name){monitoringChartRanges={cpu:{type:'relative',minutes:30,label:'Last 30 minutes'},memory:{type:'relative',minutes:30,label:'Last 30 minutes'},response:{type:'relative',minutes:30,label:'Last 30 minutes'}};}
      monitoringDashboardDeviceName=name;
      monitoringDashboardIsWindows=false;
      stopMonitoringLiveGaugeRefresh();
      const status=document.getElementById('nodeDashStatus');
      if(status)status.textContent=forceRefresh?'Polling now...':'Loading monitoring data...';
      openSettingsPopup('monitoringNodeDashboardModal');
      if(!monitoringDashboardAutoRefreshTimer){
        monitoringDashboardAutoRefreshTimer=setInterval(()=>{if(monitoringDashboardDeviceName)refreshMonitoringNodeDashboard();},30000);
      }
      try{
        const queryWindow=getDashboardQueryWindow();const requestBody={device_name:name,limit:144,force_refresh:Boolean(forceRefresh)};if(queryWindow&&queryWindow.start&&queryWindow.end){requestBody.range_start=queryWindow.start;requestBody.range_end=queryWindow.end;}
        const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),20000);
        const res=await fetch(MONITORING_DASHBOARD_DATA_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(requestBody),signal:controller.signal});
        clearTimeout(timer);
        if(res.status===401){window.location='{{ url_for("login", expired=1) }}';return;}
        let data={};try{data=await res.json();}catch(_e){data={ok:false,error:`HTTP ${res.status}`};}
        if(!res.ok||!data?.ok){
          if(status)status.textContent=String(data?.error||'Failed to load dashboard data.');
          return;
        }
        const device=data.device||{};
        const latest=data.latest||{};
        const series=Array.isArray(data.series)?data.series:[];
        const availability=(data&&typeof data.availability==='object'&&data.availability)?data.availability:{};
        const windowsServer=(data&&typeof data.windows_server==='object'&&data.windows_server)?data.windows_server:{};
        monitoringDashboardIsWindows=Boolean(windowsServer?.is_windows_server);
        const alerts=Array.isArray(data.alerts)?data.alerts:[];
        const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=String(val??'-');};
        const statusRaw=String(latest.status||'unknown').trim();
        const statusUpper=statusRaw.toUpperCase();
        const uptimeText=(windowsServer&&statusRaw.toLowerCase()==='up')?formatUptime(windowsServer.uptime_seconds):'-';
        const statusDisplay=(statusRaw.toLowerCase()==='up'&&uptimeText&&uptimeText!=='-')?`${statusUpper} / ${uptimeText}`:statusRaw;
        set('ndName',device.name||name);
        set('ndHost',device.host||'-');
        set('ndStatus',statusDisplay);
        set('ndCategory',device.category||'-');
        set('ndMethod',device.polling_method||'-');
        set('ndInterval',`${device.interval_seconds||30}s`);
        set('ndLast',formatDateTime(latest.collected_at||''));
        set('ndInterfaces',`${latest.interfaces_up??'-'} up / ${latest.interfaces_down??'-'} down`);
        set('ndNotes',device.notes||'-');
        setGaugeRing('ndCpuGauge',Number(latest.cpu_percent||0),100);
        setGaugeRing('ndMemGauge',Number(latest.memory_percent||0),100);
        setGaugeRing('ndSlaGauge',Number(latest.sla_ms||0),300);
        monitoringDashboardSeries=series;
        renderMonitoringTrendCharts();
        setAvailabilityRow('ndAvailWeek',availability.week);
        setAvailabilityRow('ndAvailMonth',availability.month);
        setAvailabilityRow('ndAvailHalfYear',availability.half_year);
        setAvailabilityRow('ndAvailYear',availability.year);
        renderWindowsServerCards(windowsServer);
        if(monitoringDashboardIsWindows)startMonitoringLiveGaugeRefresh();else stopMonitoringLiveGaugeRefresh();
        renderMonitoringAlerts(alerts);
        if(status)status.textContent=`Loaded ${series.length} samples.`;
      }catch(error){
        if(status)status.textContent=(error&&error.name==='AbortError')?'Dashboard load timeout (20s). Try again.':'Failed to load dashboard data.';
      }
    }
    function refreshMonitoringNodeDashboard(){if(!monitoringDashboardDeviceName)return;if(!shouldAutoRefreshNodeDashboard())return;openMonitoringNodeDashboard(monitoringDashboardDeviceName,false);}

    function renderMonitoringResources(){const title=document.getElementById('mrDeviceTitle');const host=document.getElementById('mrDeviceHost');if(title)title.textContent=monitoringResourceState.deviceName||'-';if(host)host.textContent=monitoringResourceState.host||'-';const mWrap=document.getElementById('mrMetricChecks');const iWrap=document.getElementById('mrInterfaceChecks');if(mWrap){mWrap.innerHTML=(monitoringResourceState.metrics||[]).map((m)=>{const checked=monitoringResourceState.selectedMetrics.has(m)?'checked':'';return `<label class="monitor-mini-row"><input type="checkbox" data-kind="metric" value="${escapeHtml(m)}" ${checked}> ${escapeHtml(m.toUpperCase())}</label>`;}).join('');}if(iWrap){const rows=Array.isArray(monitoringResourceState.interfaces)?monitoringResourceState.interfaces:[];iWrap.innerHTML=rows.length?rows.map((row)=>{const iface=String(row.interface||'').trim();const checked=monitoringResourceState.selectedInterfaces.has(iface)?'checked':'';const status=String(row.status||'-').trim();const vlan=String(row.vlan||'-').trim();const desc=String(row.description||'').trim()||'-';return `<label class="monitor-mini-row"><input type="checkbox" data-kind="interface" value="${escapeHtml(iface)}" ${checked}> <b>${escapeHtml(iface)}</b> | VLAN ${escapeHtml(vlan)} | ${escapeHtml(status)} | ${escapeHtml(desc)}</label>`;}).join(''):'<div class="monitor-mini-row">No interfaces discovered.</div>';}const s=document.getElementById('mrStatus');if(s)s.textContent='';}
    async function openMonitoringResources(deviceName){const name=String(deviceName||'').trim();if(!name)return;monitoringResourceState={deviceName:name,host:'',interfaces:[],metrics:['cpu','memory','interfaces','sla'],selectedMetrics:new Set(['cpu','memory','interfaces','sla']),selectedInterfaces:new Set()};openSettingsPopup('monitoringResourcesModal');renderMonitoringResources();await pullMonitoringResources();}
    async function pullMonitoringResources(){const s=document.getElementById('mrStatus');if(s)s.textContent='Pulling resources...';try{const res=await fetch(MONITORING_PULL_RESOURCES_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_name:monitoringResourceState.deviceName})});const data=await res.json();if(!res.ok||!data?.ok){if(s)s.textContent=String(data?.error||'Failed to pull resources.');return;}monitoringResourceState.host=String(data.host||'');monitoringResourceState.metrics=Array.isArray(data.metrics)?data.metrics:['cpu','memory','interfaces','sla'];monitoringResourceState.interfaces=Array.isArray(data.interfaces)?data.interfaces:[];monitoringResourceState.selectedMetrics=new Set(Array.isArray(data.selected_metrics)?data.selected_metrics.map((x)=>String(x||'').trim().toLowerCase()).filter(Boolean):[]);monitoringResourceState.selectedInterfaces=new Set(Array.isArray(data.selected_interfaces)?data.selected_interfaces.map((x)=>String(x||'').trim()).filter(Boolean):[]);renderMonitoringResources();if(s)s.textContent=`Loaded ${monitoringResourceState.interfaces.length} interfaces.`;}catch(_e){if(s)s.textContent='Failed to pull resources.';}}
    function selectAllMonitoringInterfaces(){const rows=Array.isArray(monitoringResourceState.interfaces)?monitoringResourceState.interfaces:[];monitoringResourceState.selectedInterfaces=new Set(rows.map((r)=>String(r.interface||'').trim()).filter(Boolean));renderMonitoringResources();}

    function syncMonitoringResourceSelection(){const metrics=new Set();const interfaces=new Set();document.querySelectorAll('#mrMetricChecks input[type=\"checkbox\"]').forEach((el)=>{if(el.checked)metrics.add(String(el.value||'').trim().toLowerCase());});document.querySelectorAll('#mrInterfaceChecks input[type=\"checkbox\"]').forEach((el)=>{if(el.checked)interfaces.add(String(el.value||'').trim());});monitoringResourceState.selectedMetrics=metrics;monitoringResourceState.selectedInterfaces=interfaces;}
    async function saveMonitoringResources(){syncMonitoringResourceSelection();const s=document.getElementById('mrStatus');if(s)s.textContent='Saving selection...';try{const res=await fetch(MONITORING_SAVE_RESOURCES_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_name:monitoringResourceState.deviceName,metrics:Array.from(monitoringResourceState.selectedMetrics),interfaces:Array.from(monitoringResourceState.selectedInterfaces)})});const data=await res.json();if(!res.ok||!data?.ok){if(s)s.textContent=String(data?.error||'Failed to save resources.');return;}if(s)s.textContent='Saved.';setTimeout(()=>{closeSettingsPopup('monitoringResourcesModal');location.reload();},300);}catch(_e){if(s)s.textContent='Failed to save resources.';}}
    async function testMonitoringSnmp(){const status=document.getElementById('mnSnmpTestStatus');const btn=document.querySelector('#mnSnmpBlock button[onclick=\"testMonitoringSnmp()\"]');if(status){status.className='small';status.textContent='Testing SNMP...';}if(btn)btn.disabled=true;const host=String(document.getElementById('mnIpAddress')?.value||'').trim();const snmpVersion=String(document.getElementById('mnSnmpVersion')?.value||'2c').trim();const snmpPort=String(document.getElementById('mnSnmpPort')?.value||'161').trim();const community=String(document.getElementById('mnCommunity')?.value||'').trim();const payload={host,snmp_version:snmpVersion,snmp_port:snmpPort,community,snmpv3_username:String(document.getElementById('mnSnmpV3Username')?.value||'').trim(),snmpv3_auth_password:String(document.getElementById('mnSnmpV3Auth')?.value||'').trim(),snmpv3_priv_password:String(document.getElementById('mnSnmpV3Priv')?.value||'').trim(),snmpv3_auth_protocol:String(document.getElementById('mnSnmpV3AuthProto')?.value||'sha').trim(),snmpv3_priv_protocol:String(document.getElementById('mnSnmpV3PrivProto')?.value||'aes128').trim()};const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);try{const res=await fetch(MONITORING_TEST_SNMP_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});const data=await res.json();if(!res.ok||!data?.ok){if(status){status.className='err';status.textContent=String(data?.error||'SNMP test failed.');}return;}const details=data.details||{};const cpu=details.cpu_percent===null||details.cpu_percent===undefined?'-':`${details.cpu_percent}%`;const ifn=details.if_number===null||details.if_number===undefined?'-':String(details.if_number);if(status){status.className='info';status.textContent=`SNMP OK | sysName: ${details.sysname||'-'} | ifNumber: ${ifn} | CPU: ${cpu}`;}}catch(error){if(status){status.className='err';status.textContent=(error&&error.name==='AbortError')?'SNMP test timed out (12s). Check reachability/ACL/credentials.':'SNMP test failed.';}}finally{clearTimeout(timer);if(btn)btn.disabled=false;}}
    function syncSelectedButtonCommand(){const select=document.getElementById('editCommandButtonSelect');const box=document.getElementById('editCommandText');if(!select||!box)return;const chosen=select.options[select.selectedIndex];if(!chosen)return;const command=String(chosen.getAttribute('data-command')||'');box.value=command;}
