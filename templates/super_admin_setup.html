<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Setup Super Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-bg"></div>
  <div class="card narrow glass">
    <h1>First-Time Setup: Super Admin</h1>
    <p>Create super admin account (required before using settings page).</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Super Admin Username</label>
      <input name="username" type="text" required>

      <label>Password</label>
      <input name="password" type="password" required>

      <label>Confirm Password</label>
      <input name="confirm_password" type="password" required>

      <button class="btn run" type="submit">Create Super Admin</button>
    </form>
  </div>
</body>
</html>
