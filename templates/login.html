<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Network Tool - Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-bg"></div>
  <div class="card narrow glass">
    <h1>Network Automation Login</h1>
    <p>Authenticate with local credentials or Cisco ISE (RADIUS).</p>

    <div class="action-row">
      <a class="btn" href="{{ url_for('verify_super_admin_route') }}">Settings (Super Admin)</a>
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post">
      <label>Auth Mode</label>
      <select name="auth_mode">
        <option value="local">Local Device Login</option>
        <option value="ise">ISE Credentials (RADIUS)</option>
      </select>

      <label>Username</label>
      <input name="username" type="text" required>

      <label>Password</label>
      <input name="password" type="password" placeholder="Leave blank only for first-time local user setup">

      <label>SSH Timeout (seconds)</label>
      <input name="timeout" type="number" value="8" min="3" max="30">

      <button class="btn run" type="submit">Login</button>
    </form>
  </div>
</body>
</html>
