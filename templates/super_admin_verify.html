{% extends "layouts/base.html" %}
{% block page_title %}Super Admin Verification{% endblock %}
{% block body %}
  {% include "components/back_to_login_strip.html" %}
  <div class="card narrow glass">
    <h1>Super Admin Verification</h1>
    <p>Enter super admin credentials to open settings.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Username</label>
      <input name="username" type="text" required>

      <label>Password</label>
      <input name="password" type="password" required>

      <button class="btn run" type="submit">Verify</button>
    </form>
  </div>
{% endblock %}
