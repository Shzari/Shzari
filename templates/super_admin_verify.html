<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Super Admin Verification</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page-bg"></div>
  <div class="user-strip">
    <a class="logout-link" href="{{ url_for('login') }}">Back to Login</a>
  </div>
  <div class="card narrow glass">
    <h1>Super Admin Verification</h1>
    <p>Enter super admin credentials to open settings.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
      <label>Username</label>
      <input name="username" type="text" required>

      <label>Password</label>
      <input name="password" type="password" required>

      <button class="btn run" type="submit">Verify</button>
    </form>
  </div>
</body>
</html>
