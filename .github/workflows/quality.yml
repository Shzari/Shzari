name: Quality

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff black mypy

      - name: Syntax compile
        run: python -m compileall app tests

      - name: Ruff
        run: ruff check app/routes app/services tests

      - name: Black
        run: black --check app/routes app/services tests

      - name: MyPy (core boundaries)
        run: mypy app/routes/auth.py app/services/auth_service.py tests

      - name: Pytest
        run: pytest -q
